services:
  - type: web
    name: ayasofya-backend
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node src/server.js
    disk:
      name: ayasofya-data
      mountPath: /opt/render/project/src
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/ayasofya.db
      - key: UPLOADS_DIR
        value: /opt/render/project/src/uploads
